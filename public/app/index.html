<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="dark light">
<title>Airlog</title>
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="icon" href="favicon-32.png" type="image/png" sizes="32x32">
<link rel="apple-touch-icon" href="apple-touch-icon.png" sizes="180x180">
<meta name="theme-color" content="#050a11">
<script>
  // theme before paint: ?theme=light|dark → localStorage → system
  (() => {
    const q = new URLSearchParams(location.search).get('theme');
    const t = q || localStorage.getItem('airlog-theme') || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
    document.documentElement.dataset.theme = t === 'light' ? 'light' : 'dark';
    if (q) localStorage.setItem('airlog-theme', document.documentElement.dataset.theme);
  })();
</script>
<link rel="preload" href="fonts/inter-latin-wght-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="account.css">
</head>
<body>
<div class="cosmos" aria-hidden="true"><i class="n1"></i><i class="n2"></i><i class="n3"></i><i class="stars" id="stars"></i></div>

<div class="shell">
  <aside class="side" aria-label="Primary" id="side">
    <a class="brand" href="#account" aria-label="Airlog account"><svg class="mark"><use href="icons.svg#i-mark"/></svg><span class="lb">Airlog</span></a>
    <nav class="nav" aria-label="Sections">
      <a data-nav="account" href="#account" title="Account"><svg><use href="icons.svg#i-account"/></svg><span class="lb">Account</span></a>
    </nav>
    <button class="side-pin" id="side-pin" type="button" aria-label="Pin side panel open" aria-pressed="false" title="Expand / collapse"><svg><use href="icons.svg#i-pin"/></svg></button>
  </aside>

  <div class="main">
    <header class="topbar">
      <a class="brand brand-sm" href="#account"><svg class="mark"><use href="icons.svg#i-mark"/></svg><span>Airlog</span></a>
      <nav class="crumbs" id="crumbs" aria-label="Breadcrumb"></nav>
    </header>
    <main id="main">
      <section id="v-account" aria-label="Account"></section>
    </main>
  </div>
</div>
<script type="module" src="app.js"></script>
</body>
</html>
